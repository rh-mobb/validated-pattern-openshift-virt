apiVersion: v1
kind: ServiceAccount
metadata:
  name: trident-from-metadata
  namespace: trident
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trident-from-metadata
  namespace: trident
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "serviceaccounts"]
    verbs: ["get", "list", "patch", "update", "create"]
  - apiGroups: ["trident.netapp.io"]
    resources: ["tridentbackendconfigs"]
    verbs: ["get", "list", "patch", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trident-from-metadata
  namespace: trident
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trident-from-metadata
subjects:
  - kind: ServiceAccount
    name: trident-from-metadata
    namespace: trident
---
# TridentOrchestrator is cluster-scoped (spec.namespace is not a namespaced object).
# The Job also `oc get crd` while waiting for TridentBackendConfig.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: trident-from-metadata
rules:
  - apiGroups: ["trident.netapp.io"]
    resources: ["tridentorchestrators"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: trident-from-metadata
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: trident-from-metadata
subjects:
  - kind: ServiceAccount
    name: trident-from-metadata
    namespace: trident
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trident-from-metadata-gitops
  namespace: openshift-gitops
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trident-from-metadata-gitops
  namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trident-from-metadata-gitops
subjects:
  - kind: ServiceAccount
    name: trident-from-metadata
    namespace: trident
