apiVersion: v1
kind: ServiceAccount
metadata:
  name: trident-from-metadata
  namespace: trident
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trident-from-metadata
  namespace: trident
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "serviceaccounts"]
    verbs: ["get", "list", "patch", "update", "create"]
  - apiGroups: ["trident.netapp.io"]
    resources: ["tridentorchestrators", "tridentbackendconfigs"]
    verbs: ["get", "list", "patch", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trident-from-metadata
  namespace: trident
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trident-from-metadata
subjects:
  - kind: ServiceAccount
    name: trident-from-metadata
    namespace: trident
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: trident-from-metadata-gitops
  namespace: openshift-gitops
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: trident-from-metadata-gitops
  namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trident-from-metadata-gitops
subjects:
  - kind: ServiceAccount
    name: trident-from-metadata
    namespace: trident
