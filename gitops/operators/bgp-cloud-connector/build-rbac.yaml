# Shipwright buildah BuildRun: push to internal registry + privileged build pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shipwright-build
  namespace: openshift-bgp-cloud-connector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shipwright-build-registry
  namespace: openshift-bgp-cloud-connector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:registry
subjects:
  - kind: ServiceAccount
    name: shipwright-build
    namespace: openshift-bgp-cloud-connector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shipwright-build-image-builder
  namespace: openshift-bgp-cloud-connector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-builder
subjects:
  - kind: ServiceAccount
    name: shipwright-build
    namespace: openshift-bgp-cloud-connector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shipwright-build-privileged
  namespace: openshift-bgp-cloud-connector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: shipwright-build
    namespace: openshift-bgp-cloud-connector
