apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Pin must match ../buildconfig.yaml spec.source.git.ref (bump together).
  - https://github.com/openshift/bgp-cloud-connector/config/default?ref=1515f61073c2d7f1efcd984bd182ee908784428a
  - imagestream.yaml
  - buildconfig.yaml
  - build-rbac.yaml
images:
  - name: controller
    newName: image-registry.openshift-image-registry.svc:5000/openshift-bgp-cloud-connector/operator
    newTag: dev
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: openshift-bgp-cloud-connector-controller-manager
    path: manager-sync-wave-patch.yaml