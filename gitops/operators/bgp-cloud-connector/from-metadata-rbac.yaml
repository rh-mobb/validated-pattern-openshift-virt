apiVersion: v1
kind: ServiceAccount
metadata:
  name: bgp-from-metadata
  namespace: openshift-bgp-cloud-connector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bgp-from-metadata
  namespace: openshift-bgp-cloud-connector
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bgp-from-metadata
  namespace: openshift-bgp-cloud-connector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bgp-from-metadata
subjects:
  - kind: ServiceAccount
    name: bgp-from-metadata
    namespace: openshift-bgp-cloud-connector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bgp-from-metadata
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.openshift.io"]
    resources: ["bgpcloudconfigurations"]
    verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bgp-from-metadata
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bgp-from-metadata
subjects:
  - kind: ServiceAccount
    name: bgp-from-metadata
    namespace: openshift-bgp-cloud-connector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bgp-from-metadata-gitops
  namespace: openshift-gitops
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
    resourceNames: ["bgp-platform-metadata"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bgp-from-metadata-gitops
  namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bgp-from-metadata-gitops
subjects:
  - kind: ServiceAccount
    name: bgp-from-metadata
    namespace: openshift-bgp-cloud-connector
