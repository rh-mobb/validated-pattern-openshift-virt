apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # CRDs + manager + RBAC. Pin must match BuildConfig spec.source.git.ref
  # (v1beta1 BGPCloudConfiguration/BGPRouting; bump both together).
  - https://github.com/openshift/bgp-cloud-connector/config/default?ref=2b6ad93989a2adfe4b52d4067f70a782aabd9a11
  - imagestream.yaml
  - buildconfig.yaml
  - build-rbac.yaml
  - from-metadata-rbac.yaml
  - from-metadata-job.yaml
  # Temporary until openshift/bgp-cloud-connector#121 (see rh-mobb/validated-pattern-openshift-virt#9).
  - azure-nic-ip-forwarding-ds.yaml
images:
  - name: controller
    newName: image-registry.openshift-image-registry.svc:5000/openshift-bgp-cloud-connector/operator
    newTag: dev
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: openshift-bgp-cloud-connector-controller-manager
    path: wi-patch.yaml
