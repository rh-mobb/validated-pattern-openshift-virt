# Example placement matching the Classic installer's aro-classic-virt pool intent.
apiVersion: hco.kubevirt.io/v1beta1
kind: HyperConverged
metadata:
  name: kubevirt-hyperconverged
  namespace: openshift-cnv
spec:
  workloads:
    nodePlacement:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
        pool: np-virt
      tolerations:
        - key: workload
          operator: Equal
          value: virtualization
          effect: NoSchedule
